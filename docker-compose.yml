# Local development convenience only — not a deployment topology.
# Reads the same DB_* variables from .env that Django uses (docker compose
# auto-loads a .env file in this directory), so `docker compose up` and
# `manage.py` stay in sync without duplicating config.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-enterprise_ai_platform}
      POSTGRES_USER: ${DB_USER:-enterprise_ai_platform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
